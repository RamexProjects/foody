<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foody - Your Recipe Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="chat-container">
        <header class="chat-header">
            <div class="logo">Foody 🥗</div>
            <p class="subtitle">I only cook, I don't chat.</p>
        </header>

        <div class="chat-box" id="chat-box">
            <div class="message bot-message">
                Hello! I am Foody. Ask me for a recipe (e.g., "How to make Pizza?").
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask for a recipe..." autocomplete="off">
            <button id="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
